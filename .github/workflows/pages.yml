# Veröffentlicht den Ordner docs/ als Webseite unter
# https://wolfiebu-ship-it.github.io/Hausaufgaben-App-designed-by-Ebu/
#
# "enablement: true" schaltet GitHub Pages beim ersten Lauf selbst ein –
# man muss also nichts von Hand in den Einstellungen umstellen.
name: Homy als Webseite veröffentlichen

on:
  push:
    branches: [claude/homework-schedule-app-y91c1u]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur eine Veröffentlichung gleichzeitig, und laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichung.outputs.page_url }}
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Ordner docs einpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Veröffentlichen
        id: veroeffentlichung
        uses: actions/deploy-pages@v4
